events {
    worker_connections 1024;
}

http {
    upstream marroquineria-balta-frontend {
        server react:3000;
    }

    server {
        listen 8070;
        charset utf-8;
        access_log off;

        # Frontend static app (proxied to react container)
        location / {
            proxy_pass http://marroquineria-balta-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy API calls from frontend to backend LB (nginx-backend)
        location /api/ {
            proxy_pass http://nginx-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}